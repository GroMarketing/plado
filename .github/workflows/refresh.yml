# Daily refresh: fetch the catalog, rescan what changed, rebuild, deploy, keep the snapshots.
# Triggered by the Cloudflare cron in cron/ (workflow_dispatch). Never put a `schedule:` here:
# GitHub's scheduler silently drops runs, so the schedule lives on Cloudflare.
# The refresh job's own token is READ-ONLY (it is visible to steps that unpack third-party
# code); only the small snapshots job can write, and it touches nothing third-party.
# Optional secret: PLADO_GH_PAT = fine-grained, public repositories read-only, for a higher
# GitHub API rate limit. Without it the job uses its own read-only token.
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID = Plado's account only: Pages edit, D1 edit, Analytics read.
# Used by the traffic, deploy and sponsor-review steps, never by steps that touch third-party code.
name: refresh
on:
  workflow_dispatch:
    inputs:
      installs:
        description: Also recount installs in real projects (slow, GitHub code search 10/min)
        type: boolean
        default: false
      deploy:
        description: Deploy the build
        type: boolean
        default: true
concurrency: { group: refresh, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SITE_URL: https://plado.pages.dev
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Required secrets
        env: { B: "${{ secrets.CLOUDFLARE_API_TOKEN }}", C: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
        run: '[ -n "$B" ] && [ -n "$C" ] || { echo "missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"; exit 1; }'
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/scan/cache
            site/data/.cache-skills
            site/data/.cache-trending
          key: plado-data-${{ github.run_id }}
          restore-keys: plado-data-
      - name: Scanner (pinned)
        run: |
          python -m venv pipeline/scan/.venv
          pipeline/scan/.venv/bin/pip install --quiet -r pipeline/scan/requirements.lock
      - name: Fetch catalog
        env: { GH_TOKEN: "${{ secrets.PLADO_GH_PAT || github.token }}" }
        run: node site/data/fetch-catalog.mjs
      - name: Fetch skills, prompts, rules, subagents
        env: { GH_TOKEN: "${{ secrets.PLADO_GH_PAT || github.token }}" }
        run: |
          node site/data/fetch-skills-prompts.mjs prompts
          node site/data/fetch-skills-prompts.mjs rules
          node site/data/fetch-skills-prompts.mjs agents
          node site/data/fetch-skills-prompts.mjs skills
      - name: First build (index for trending, installs and the scan)
        run: node site/build.mjs
      - name: Trending
        env: { GH_TOKEN: "${{ secrets.PLADO_GH_PAT || github.token }}" }
        run: node site/data/fetch-trending.mjs
      - name: Installs (weekly, Mondays, or on request)
        if: inputs.installs
        env: { GH_TOKEN: "${{ secrets.PLADO_GH_PAT || github.token }}" }
        run: node pipeline/usage/installs.mjs
      - name: Security scan (cached per commit/version)
        env: { GH_TOKEN: "${{ secrets.PLADO_GH_PAT || github.token }}" }
        run: node pipeline/scan/full.mjs --jobs 4 --minutes 120
      - name: Affiliate guard (affiliate data never reaches scoring)
        run: node site/test/affiliate-guard.mjs
      - name: Traffic for the advertise page (Cloudflare Web Analytics, last 30 days)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
            const d=(n)=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
            const q=`{viewer{accounts(filter:{accountTag:"${process.env.CLOUDFLARE_ACCOUNT_ID}"}){rumPageloadEventsAdaptiveGroups(limit:1,filter:{date_geq:"${d(30)}",date_leq:"${d(0)}",requestHost:"plado.pages.dev"}){sum{visits}}}}}`;
            fetch("https://api.cloudflare.com/client/v4/graphql",{method:"POST",headers:{authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN,"content-type":"application/json"},body:JSON.stringify({query:q})})
              .then(r=>r.json()).then(j=>{const v=j?.data?.viewer?.accounts?.[0]?.rumPageloadEventsAdaptiveGroups?.[0]?.sum?.visits||0; console.log("visits 30d",v); require("fs").appendFileSync(process.env.GITHUB_ENV,`VISITS_30D=${v}\n`);})
              .catch(e=>console.log("traffic unavailable",e.message));'
      - name: Final build
        run: node site/build.mjs
      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/scan/cache
            site/data/.cache-skills
            site/data/.cache-trending
          key: plado-data-${{ github.run_id }}
      - name: Sanity gate (refuse to replace the live site with a much smaller one)
        run: |
          node -e '
            const fs=require("fs");
            const n=JSON.parse(fs.readFileSync("site/dist/data/index.json","utf8")).entries.length;
            fetch("https://plado.pages.dev/data/index.json").then(r=>r.ok?r.json():null).then(j=>{
              const live=j?.entries?.length||0; console.log(`new ${n} entries, live ${live}`);
              if (process.env.DRAFTS) { console.error("DRAFTS build, refusing"); process.exit(1); }
              if (n < 500 || (live && n < live*0.8)) { console.error("catalog shrank too much, refusing to deploy"); process.exit(1); }
            }).catch(e=>{ console.log("live index unreadable, gate on minimum only", e.message); if (n < 500) process.exit(1); })
              .then(()=>{ const files=require("child_process").execSync("find site/dist -type f | wc -l").toString().trim()*1;
                if (files >= 20000) { console.error(`${files} files, over the Cloudflare Pages limit of 20,000`); process.exit(1); } });'
      - name: Deploy
        if: inputs.deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.112.0 pages deploy dist --project-name plado --branch main --commit-dirty=true
      - name: Hand the day's snapshots to the snapshots job
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            site/data/history
            site/data/installs.json
          retention-days: 3

  # The only job that can write to the repo. It runs no third-party code: it takes the
  # snapshot files from the refresh job and commits them.
  snapshots:
    needs: refresh
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: snapshots, path: site/data }
      - name: Commit snapshots
        run: |
          git config user.name "Plado"
          git config user.email "268403919+GroMarketing@users.noreply.github.com"
          git add site/data/history site/data/installs.json
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(date -u +%F) [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main

  # A sponsor still inside its 48-hour hold needs a look before it goes live, and a
  # rejected or sold-out one needs a refund. This job fails (GitHub emails the run's owner)
  # when either exists. The log is public, so it prints counts only, never names or emails.
  sponsor-review:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: New sponsor checkouts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # review: anything still inside its 48-hour hold (so no gap between runs can skip it)
          # refund: rejected or sold-out rows from the last 3 days (flagged on every run until then)
          NOW=$(( $(date +%s) * 1000 )); SINCE=$(( NOW - 72*3600*1000 ))
          OUT=$(npx --yes wrangler@4.112.0 d1 execute plado --remote --json --command "SELECT COALESCE(SUM(status IN ('ok','unpaid') AND live_at > $NOW),0) AS review, COALESCE(SUM(status = 'rejected' AND created_at >= $SINCE),0) AS refund FROM sponsors")
          node -e 'const r=JSON.parse(process.argv[1])[0].results[0]||{}; const a=r.review||0, b=r.refund||0;
            console.log(`new sponsors to review: ${a} · need a refund: ${b}`);
            if (a||b) { console.log("Open Stripe: block one by cancelling its subscription before the 48 hours are up; refund the rejected ones."); process.exit(1); }' "$OUT"
